; PlatformIO Project Configuration File
; ESP32-S3 + ESP-IDF nativo -> LTR-390UV-01 (I2C GPIO4/GPIO5) + WiFi STA + mDNS + servidor web

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

; Memoria (coincide con sdkconfig.defaults)
board_upload.flash_size = 8MB

; Serial
upload_speed = 921600
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder

; El componente espressif/mdns se declara en src/idf_component.yml
; (requiere internet SOLO durante el primer build para descargarlo).
build_flags =
    -Wno-error=unused-function
